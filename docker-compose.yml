version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: HR

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: "${MONGODB_URI}"
      DB_NAME: "HR"
      JWT_SECRET: "${JWT_SECRET}"
      ALLOWED_ORIGINS: "http://localhost:5174"
    depends_on:
      - mongodb

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  c1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      MONGODB_URI: "${MONGODB_URI}"
      DB_NAME: "HR"
      PORT: "8001"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    working_dir: /app/component1/backend
    depends_on:
      - mongodb

  c2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # c2 runs candidate-authored code; give it the Docker CLI it needs to
        # launch the hardened runner container.
        WITH_DOCKER_CLI: "1"
    ports:
      - "8002:8002"
    environment:
      MONGODB_URI: "${MONGODB_URI}"
      DB_NAME: "HR"
      PORT: "8002"
      # Candidate code is graded inside a network-less, read-only, non-root
      # container (component2/backend/sandbox).  "docker" makes the service
      # refuse to start rather than silently grade code unisolated.
      CODE_SANDBOX: "${CODE_SANDBOX:-docker}"
      CODE_SANDBOX_IMAGE: "${CODE_SANDBOX_IMAGE:-recruitai-py-sandbox:1}"
    volumes:
      # Lets c2 start the runner container.  The socket is root-equivalent to
      # the host, so c2 itself must stay trusted -- the candidate's code is what
      # runs in the sandbox, and that container never sees this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    working_dir: /app/component2/backend
    depends_on:
      - mongodb

  c3:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      MONGODB_URI: "${MONGODB_URI}"
      DB_NAME: "HR"
      PORT: "8003"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]
    working_dir: /app/component3/backend
    depends_on:
      - mongodb

  c4:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      MONGODB_URI: "${MONGODB_URI}"
      DB_NAME: "HR"
      PORT: "8004"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004"]
    working_dir: /app/component4/backend
    depends_on:
      - mongodb

volumes:
  mongo_data:
